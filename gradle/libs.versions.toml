[versions]
agp = "9.2.0"
kotlin = "2.3.21"
coroutines = "1.11.0"
composeBom = "2026.06.01"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
coreKtx = "1.17.0"
maplibre = "13.6.1"
materialIcons = "1.7.8"
junit = "4.13.2"
androidTestRunner = "1.6.2"
androidTestJunit = "1.2.1"
graphhopper = "11.0"
sqliteJdbc = "3.53.4.0"
detekt = "2.0.0-alpha.6"
okhttp = "5.4.0" # 5.5.0 needs compileSdk 37 (the pinned AndroidX set is on 36)
spotless = "8.10.3"
ktlint = "1.8.0"
desugarJdkLibs = "2.1.5"

[libraries]
# Newer JDK APIs (e.g. Stream.toList used by GraphHopper) for Android versions that lack them.
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "materialIcons" }
maplibre-android = { module = "org.maplibre.gl:android-sdk-opengl", version.ref = "maplibre" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidTestRunner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidTestJunit" }
graphhopper-core = { module = "com.graphhopper:graphhopper-core", version.ref = "graphhopper" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }
graphhopper-map-matching = { module = "com.graphhopper:graphhopper-map-matching", version.ref = "graphhopper" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
