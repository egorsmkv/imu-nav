[workspace]
members = ["nav-core", "nav-jni", "nav-sim"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.99"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

# Host measurements need optimization and symbols; Android release settings stay unchanged.
[profile.profiling]
inherits = "release"
debug = 2
strip = "none"
