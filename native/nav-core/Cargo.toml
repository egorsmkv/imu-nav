[package]
name = "imu-nav-core"
version = "0.1.0"
description = "Deterministic route-constrained estimation for IMU Nav"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
hotpath = { version = "=0.28.4", default-features = false, optional = true }

[features]
profiling = ["dep:hotpath", "hotpath/hotpath"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
