[package]
name = "imu-nav-jni"
version = "0.1.0"
description = "JNI bridge from Android to the IMU Nav Rust core"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
imu-nav-core = { path = "../nav-core" }
jni = { version = "0.21", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
heap-profile = ["dep:tikv-jemallocator", "dep:jemalloc_pprof"]

[target.'cfg(target_os = "linux")'.dependencies]
# Keep malloc symbols prefixed: this library must not replace the JVM's allocator.
tikv-jemallocator = { version = "0.7", features = ["profiling", "disable_initial_exec_tls"], optional = true }
jemalloc_pprof = { version = "0.9", optional = true }
