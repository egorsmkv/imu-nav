name: F-Droid build

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
  merge_group:

# Manual builds and tags keep independent runs; only superseded validation is canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  fdroid:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Move RELEASE_* and BENCHMARK_* keys here; ci-validation has no private keys.
    environment: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && 'android-distribution' || 'ci-validation' }}
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select affected work
        id: changes
        run: python3 tools/ci_changes.py --suite fdroid
      - name: Cache Cargo downloads
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/Cargo.lock', 'server/Cargo.lock') }}
          restore-keys: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up OpenJDK 17
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust for Android
        if: steps.changes.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Set up Gradle
        if: steps.changes.outputs.run == 'true'
        uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3
        if: steps.changes.outputs.run == 'true'
        with:
          packages: platform-tools
      - name: Install pinned Android toolchain
        if: steps.changes.outputs.run == 'true'
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'

      - name: Build and lint F-Droid release
        if: steps.changes.outputs.run == 'true'
        run: >-
          ./gradlew --no-daemon
          :core:test
          :app:verifyFdroidDependencies
          :app:assembleFdroidRelease
          :app:assembleFdroidBenchmark
          :app:lintFdroidRelease
          -PunsignedBenchmark

      # Release credentials are never passed to code built for a PR or merge queue.
      - name: Sign direct-download release with the persistent release identity
        id: release_signing
        if: steps.changes.outputs.run == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
        env:
          IMUNAV_RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          IMUNAV_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          IMUNAV_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          IMUNAV_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          IMUNAV_RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: >-
          python3 tools/release_signing.py
          --apk app/build/outputs/apk/fdroid/release/*-unsigned.apk
          --output-dir build/release-distribution
          --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner"

      - name: Stage unsigned release for pull-request validation
        id: release_validation
        if: steps.changes.outputs.run == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        run: >-
          python3 tools/release_signing.py
          --apk app/build/outputs/apk/fdroid/release/*-unsigned.apk
          --output-dir build/release-distribution
          --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          --allow-unsigned

      - name: Sign benchmark with the persistent private identity
        id: signing
        if: steps.changes.outputs.run == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        env:
          IMUNAV_BENCHMARK_KEYSTORE_BASE64: ${{ secrets.BENCHMARK_KEYSTORE_BASE64 }}
          IMUNAV_BENCHMARK_STORE_PASSWORD: ${{ secrets.BENCHMARK_STORE_PASSWORD }}
          IMUNAV_BENCHMARK_KEY_ALIAS: ${{ secrets.BENCHMARK_KEY_ALIAS }}
          IMUNAV_BENCHMARK_KEY_PASSWORD: ${{ secrets.BENCHMARK_KEY_PASSWORD }}
          IMUNAV_BENCHMARK_CERT_SHA256: ${{ vars.BENCHMARK_CERT_SHA256 }}
        run: >-
          python3 tools/benchmark_signing.py
          --apk app/build/outputs/apk/fdroid/benchmark/*-unsigned.apk
          --output-dir build/benchmark-distribution
          --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          --allow-unsigned

      - name: Stage benchmark without private keys for PR and merge queue
        id: benchmark_validation
        if: steps.changes.outputs.run == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        run: >-
          python3 tools/benchmark_signing.py
          --apk app/build/outputs/apk/fdroid/benchmark/*-unsigned.apk
          --output-dir build/benchmark-distribution
          --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          --allow-unsigned

      - name: Verify 16 KB release ELF and APK alignment
        if: steps.changes.outputs.run == 'true'
        run: >-
          python3 tools/verify_android_pages.py
          --zipalign "$ANDROID_HOME/build-tools/36.0.0/zipalign"
          --report build/android-pages.json
          build/release-distribution/*.apk
          build/benchmark-distribution/*.apk

      - name: Upload explicitly labeled direct-download release
        if: steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: imu-nav-fdroid-release-${{ steps.release_signing.outputs.mode || steps.release_validation.outputs.mode }}-${{ github.sha }}
          path: |
            build/release-distribution/
            app/build/outputs/mapping/fdroidRelease/mapping.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload explicitly labeled benchmark artifact
        if: steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: imu-nav-fdroid-benchmark-${{ steps.signing.outputs.mode || steps.benchmark_validation.outputs.mode }}-${{ github.sha }}
          path: |
            build/benchmark-distribution/
            app/build/outputs/mapping/fdroidBenchmark/mapping.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload page-alignment evidence
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-page-alignment
          path: build/android-pages.json
          if-no-files-found: warn

  updates:
    name: Benchmark update compatibility API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select affected work
        id: changes
        run: python3 tools/ci_changes.py --suite fdroid
      - uses: actions/setup-java@v5
        if: steps.changes.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: steps.changes.outputs.run == 'true'
        with:
          packages: platform-tools
      - name: Install fixture build tools
        if: steps.changes.outputs.run == 'true'
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Enable KVM
        if: steps.changes.outputs.run == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check independent signing, update rejection and data preservation
        if: steps.changes.outputs.run == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 tools/test_benchmark_updates.py --sdk "$ANDROID_HOME" --output build/benchmark-update-evidence
      - name: Upload public test evidence
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-update-api-${{ matrix.api-level }}
          path: build/benchmark-update-evidence/
          if-no-files-found: warn
          retention-days: 14
