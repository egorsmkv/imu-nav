name: F-Droid build

on:
  workflow_dispatch:
  push:
    # branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/fdroid.yml'
      - 'app/build.gradle.kts'
      - 'app/lint.xml'
      - 'app/proguard-rules.pro'
      - 'app/src/main/**'
      - 'app/src/fdroid/**'
      - 'core/**'
      - 'routing/**'
      - 'native/**'
      - 'scripts/build-rust-android.sh'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  fdroid:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up OpenJDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0-beta
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and lint F-Droid release
        run: >-
          ./gradlew --no-daemon clean
          :core:test
          :app:verifyFdroidDependencies
          :app:assembleFdroidRelease
          :app:assembleFdroidBenchmark
          :app:lintFdroidRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: imu-nav-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/fdroid/release/*.apk
            app/build/outputs/apk/fdroid/benchmark/*.apk
          if-no-files-found: error
          retention-days: 14
