name: F-Droid build

on:
  push:
    # branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  fdroid:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0-beta
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and lint F-Droid release
        run: >-
          ./gradlew --no-daemon clean
          :core:test
          :app:verifyFdroidDependencies
          :app:assembleFdroidRelease
          :app:assembleFdroidBenchmark
          :app:lintFdroidRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: imu-nav-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/fdroid/release/*.apk
            app/build/outputs/apk/fdroid/benchmark/*.apk
          if-no-files-found: error
          retention-days: 14
