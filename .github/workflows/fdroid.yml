name: F-Droid build

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
  merge_group:

# Manual builds and tags keep independent runs; only superseded validation is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  fdroid:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select affected work
        id: changes
        run: python3 tools/ci_changes.py --suite fdroid
      - name: Cache Cargo downloads
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/Cargo.lock', 'server/Cargo.lock') }}
          restore-keys: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up OpenJDK 17
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust for Android
        if: steps.changes.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0-beta
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Set up Gradle
        if: steps.changes.outputs.run == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build and lint F-Droid release
        if: steps.changes.outputs.run == 'true'
        run: >-
          ./gradlew --no-daemon
          :core:test
          :app:verifyFdroidDependencies
          :app:assembleFdroidRelease
          :app:assembleFdroidBenchmark
          :app:lintFdroidRelease

      - name: Upload APKs
        if: steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: imu-nav-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/fdroid/release/*.apk
            app/build/outputs/apk/fdroid/benchmark/*.apk
            app/build/outputs/mapping/fdroidRelease/mapping.txt
            app/build/outputs/mapping/fdroidBenchmark/mapping.txt
          if-no-files-found: error
          retention-days: 14
