name: Offline routing pack

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      pack_name:
        description: One-word pack name (letters, digits, underscore or hyphen)
        required: true
        default: Ukraine
      osm_url:
        description: HTTPS URL of the regional OSM PBF extract
        required: true
        default: https://download.geofabrik.de/europe/ukraine-latest.osm.pbf
      ch_threads:
        description: Rust CH worker threads (profiles are prepared sequentially)
        type: choice
        options: ['1', '2', '4']
        default: '2'
        required: true
      osm_sha256:
        description: Expected OSM SHA-256; leave blank to record the downloaded file's checksum
        required: false

# Manual builds and tags keep independent runs; only superseded validation is canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.99.0

jobs:
  fixture:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select affected work
        id: changes
        run: python3 tools/ci_changes.py --suite routing
      - name: Cache native routing builder
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            native/target/release
          # Keep compiler/profile/dependency changes separate; Cargo rebuilds changed source on a fallback hit.
          key: routing-rust-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('native/Cargo.lock', 'native/Cargo.toml', 'native/nav-search/Cargo.toml', 'native/nav-routing/Cargo.toml') }}-${{ hashFiles('native/nav-search/src/**', 'native/nav-search/build.rs', 'native/nav-routing/**') }}
          restore-keys: |
            routing-rust-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('native/Cargo.lock', 'native/Cargo.toml', 'native/nav-search/Cargo.toml', 'native/nav-routing/Cargo.toml') }}-
      - name: Install native routing builder toolchain
        if: steps.changes.outputs.run == 'true'
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Test the archive validator
        if: steps.changes.outputs.run == 'true'
        run: python3 -m unittest discover -s tools/tests -p test_verify_routing_pack.py -v
      - name: Download small Monaco extract
        if: steps.changes.outputs.run == 'true'
        run: |
          mkdir -p build/routing-source
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' \
            https://download.geofabrik.de/europe/monaco-latest.osm.pbf \
            --output build/routing-source/monaco.osm.pbf
      - name: Build and verify importable archive
        if: steps.changes.outputs.run == 'true'
        run: |
          cargo build --locked --release --manifest-path native/Cargo.toml -p imu-nav-routing --features builder
          native/target/release/build-routing \
            --osm build/routing-source/monaco.osm.pbf --out build/routing-work/graph --name Monaco --threads 2
          python3 tools/verify_routing_pack.py build/routing-work/graph.zip
          mkdir -p build/routing-import/combined
          unzip -q build/routing-work/graph.zip -d build/routing-import/combined
          native/target/release/check-routing build/routing-import/combined
          for mode in car walk; do
            native/target/release/subset-routing build/routing-work/graph "build/routing-work/$mode" "$mode"
            python3 tools/verify_routing_pack.py "build/routing-work/$mode.zip"
            mkdir -p "build/routing-import/$mode"
            unzip -q "build/routing-work/$mode.zip" -d "build/routing-import/$mode"
            native/target/release/check-routing "build/routing-import/$mode"
          done

  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PACK_NAME: ${{ inputs.pack_name }}
      OSM_URL: ${{ inputs.osm_url }}
      OSM_SHA256: ${{ inputs.osm_sha256 }}
      CH_THREADS: ${{ inputs.ch_threads }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache native routing builder
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            native/target/release
          # Keep compiler/profile/dependency changes separate; Cargo rebuilds changed source on a fallback hit.
          key: routing-rust-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('native/Cargo.lock', 'native/Cargo.toml', 'native/nav-search/Cargo.toml', 'native/nav-routing/Cargo.toml') }}-${{ hashFiles('native/nav-search/src/**', 'native/nav-search/build.rs', 'native/nav-routing/**') }}
          restore-keys: |
            routing-rust-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('native/Cargo.lock', 'native/Cargo.toml', 'native/nav-search/Cargo.toml', 'native/nav-routing/Cargo.toml') }}-
      - name: Install native routing builder toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Validate inputs and report runner capacity
        run: |
          if [[ ! "$PACK_NAME" =~ ^[A-Za-z][A-Za-z0-9_-]{0,31}$ ]]; then
            echo 'Pack name must be one word starting with a letter.' >&2
            exit 1
          fi
          if [[ -n "$OSM_SHA256" && ! "$OSM_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo 'Expected OSM SHA-256 must contain 64 hexadecimal digits.' >&2
            exit 1
          fi
          if [[ "$CH_THREADS" != 1 && "$CH_THREADS" != 2 && "$CH_THREADS" != 4 ]]; then
            echo 'CH threads must be 1, 2 or 4.' >&2
            exit 1
          fi
          echo "PACK_SLUG=${PACK_NAME,,}" >> "$GITHUB_ENV"
          mkdir -p build
          lscpu | tee build/routing-runner-cpu.txt
          df -h .
          free -h
      - name: Download and verify source extract
        run: |
          mkdir -p build/routing-source
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' \
            "$OSM_URL" --output "build/routing-source/$PACK_SLUG.osm.pbf"
          actual=$(sha256sum "build/routing-source/$PACK_SLUG.osm.pbf" | cut -d' ' -f1)
          if [[ -n "$OSM_SHA256" && "$actual" != "${OSM_SHA256,,}" ]]; then
            echo "OSM SHA-256 mismatch: expected $OSM_SHA256, received $actual" >&2
            exit 1
          fi
          echo "OSM_SHA256_ACTUAL=$actual" >> "$GITHUB_ENV"
      - name: Compile standalone routing builder
        run: |
          /usr/bin/time -v -o build/routing-compile-time.txt \
            cargo build --locked --release --manifest-path native/Cargo.toml -p imu-nav-routing --features builder
      # Profiles run sequentially to bound peak memory; each CH preparation uses Rayon workers.
      - name: Build both car preferences, foot and address-search pack
        run: |
          # Compile has finished; reserve runner memory for native graph preparation.
          /usr/bin/time -v -o build/routing-build-time.txt native/target/release/build-routing \
            --osm "build/routing-source/$PACK_SLUG.osm.pbf" --out build/routing-work/graph --name "$PACK_NAME" --threads "$CH_THREADS"
          mkdir -p dist
          mv build/routing-work/graph.zip "dist/routing-$PACK_SLUG-car-walk.zip"
      - name: Package and verify each download choice
        run: |
          # Reuse prepared hierarchies; single-mode packs keep only their referenced shared data.
          for mode in car walk; do
            /usr/bin/time -v -o "build/routing-$mode-time.txt" native/target/release/subset-routing \
              build/routing-work/graph "build/routing-work/$mode" "$mode"
            mv "build/routing-work/$mode.zip" "dist/routing-$PACK_SLUG-$mode.zip"
            python3 tools/verify_routing_pack.py "dist/routing-$PACK_SLUG-$mode.zip"
            rm -rf "build/routing-work/$mode"
            mkdir -p build/routing-import
            unzip -q "dist/routing-$PACK_SLUG-$mode.zip" -d build/routing-import
            native/target/release/check-routing build/routing-import
            rm -rf build/routing-import
          done
          python3 tools/verify_routing_pack.py "dist/routing-$PACK_SLUG-car-walk.zip"
          rm -rf build/routing-work/graph
          mkdir -p build/routing-import
          unzip -q "dist/routing-$PACK_SLUG-car-walk.zip" -d build/routing-import
          native/target/release/check-routing build/routing-import
      - name: Record checksums and build details
        run: |
          for mode in car walk car-walk; do
            (cd dist && sha256sum "routing-$PACK_SLUG-$mode.zip" > "routing-$PACK_SLUG-$mode.zip.sha256")
          done
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import zipfile
          from pathlib import Path

          timing = Path('build/routing-build-time.txt').read_text()
          peak = re.search(r'Maximum resident set size \(kbytes\):\s*(\d+)', timing)
          archives = {}
          for mode in ('car', 'walk', 'car-walk'):
              archive = Path('dist') / f"routing-{os.environ['PACK_SLUG']}-{mode}.zip"
              with zipfile.ZipFile(archive) as pack:
                  info = json.loads(pack.read('pack.json'))
              with archive.open('rb') as stream:
                  checksum = hashlib.file_digest(stream, 'sha256').hexdigest()
              archives[mode] = {'filename': archive.name, 'sha256': checksum, 'bytes': archive.stat().st_size, 'pack': info}
          report = {
              'source_url': os.environ['OSM_URL'],
              'source_sha256': os.environ['OSM_SHA256_ACTUAL'],
              'source_bytes': (Path('build/routing-source') / f"{os.environ['PACK_SLUG']}.osm.pbf").stat().st_size,
              'archives': archives,
              'peak_rss_kb': int(peak.group(1)) if peak else None,
              'source_commit': os.environ['GITHUB_SHA'],
              'ch_threads': int(os.environ['CH_THREADS']),
          }
          Path('dist/routing-build.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY
      - name: Report remaining runner capacity
        if: always()
        run: |
          df -h .
          free -h
          du -sh build/routing-source build/routing-work build/routing-import dist 2>/dev/null || true
      - name: Upload car-only pack
        uses: actions/upload-artifact@v4
        with:
          name: routing-pack-car-${{ github.run_id }}
          path: |
            dist/routing-${{ env.PACK_SLUG }}-car.zip
            dist/routing-${{ env.PACK_SLUG }}-car.zip.sha256
            dist/routing-build.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload walking-only pack
        uses: actions/upload-artifact@v4
        with:
          name: routing-pack-walk-${{ github.run_id }}
          path: |
            dist/routing-${{ env.PACK_SLUG }}-walk.zip
            dist/routing-${{ env.PACK_SLUG }}-walk.zip.sha256
            dist/routing-build.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload combined car and walking pack
        uses: actions/upload-artifact@v4
        with:
          name: routing-pack-car-walk-${{ github.run_id }}
          path: |
            dist/routing-${{ env.PACK_SLUG }}-car-walk.zip
            dist/routing-${{ env.PACK_SLUG }}-car-walk.zip.sha256
            dist/routing-build.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload build timing diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routing-diagnostics-${{ github.run_id }}
          path: |
            build/routing-compile-time.txt
            build/routing-build-time.txt
            build/routing-car-time.txt
            build/routing-walk-time.txt
            build/routing-runner-cpu.txt
          if-no-files-found: warn
          retention-days: 30
