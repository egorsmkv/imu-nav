name: Android GPS instrumentation

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  build:
    name: Build GPS instrumentation APKs
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select affected work
        id: changes
        run: python3 tools/ci_changes.py --suite android
      - uses: actions/setup-java@v5
        if: steps.changes.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: steps.changes.outputs.run == 'true'
        with:
          packages: platform-tools
      - name: Install compile SDK and NDK
        if: steps.changes.outputs.run == 'true'
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.run == 'true'
        with:
          toolchain: 1.99.0-beta
          targets: x86_64-linux-android
      - uses: actions/cache@v4
        if: steps.changes.outputs.run == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/Cargo.lock', 'server/Cargo.lock') }}
          restore-keys: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-
      - uses: gradle/actions/setup-gradle@v4
        if: steps.changes.outputs.run == 'true'
      - name: Compile fixtures, check style and lint
        if: steps.changes.outputs.run == 'true'
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
        run: |
          ./gradlew --no-daemon spotlessApply
          git diff --exit-code
          CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang" \
            CARGO_TARGET_DIR="$PWD/native/target/android" \
            cargo build --locked --manifest-path native/Cargo.toml --package imu-nav-jni --release --target x86_64-linux-android
          mkdir -p app/build/generated/rustJniLibs/x86_64
          install -m 0644 native/target/android/x86_64-linux-android/release/libimu_nav_jni.so app/build/generated/rustJniLibs/x86_64/
          # Emulator APKs need only x86_64; the existing F-Droid workflow builds the ARM release ABIs.
          ./gradlew --no-daemon -x :app:buildRustAndroid detekt :app:assembleFdroidDebug :app:assembleFdroidDebugAndroidTest :app:lintFdroidDebug
          python3 tools/verify_android_pages.py --zipalign "$ANDROID_HOME/build-tools/36.0.0/zipalign" --report build/android-pages.json app/build/outputs/apk/fdroid/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.run == 'true'
        with:
          name: gps-test-apks
          path: |
            app/build/outputs/apk/fdroid/debug/*.apk
            app/build/outputs/apk/androidTest/fdroid/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload page-alignment evidence
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-page-alignment
          path: build/android-pages.json
          if-no-files-found: warn

  emulator:
    name: GPS emulator API ${{ matrix.api-level }}${{ matrix.page-size == 16384 && ' (16 KB)' || '' }}
    needs: build
    runs-on: ubuntu-latest
    env:
      ANDROID_SERIAL: emulator-5554
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api-level: 28, target: google_apis, page-size: 4096}
          - {api-level: 31, target: google_apis, page-size: 4096}
          - {api-level: 35, target: google_apis, page-size: 4096}
          - {api-level: 36, target: google_apis, page-size: 4096}
          - {api-level: 35, target: google_apis_ps16k, page-size: 16384}
    steps:
      - uses: actions/checkout@v4
        if: needs.build.outputs.run == 'true'
      - uses: actions/download-artifact@v4
        if: needs.build.outputs.run == 'true'
        with:
          name: gps-test-apks
          path: gps-test-apks
      - name: Enable KVM
        if: needs.build.outputs.run == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real LocationManager and service tests
        if: needs.build.outputs.run == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          # The 16 KB image's first-boot Google services can trigger LMK even at 4096 MB.
          ram-size: ${{ matrix.page-size == 16384 && '6144M' || '4096M' }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 tools/run_mock_location_tests.py --apk-directory gps-test-apks --output build/gps-instrumentation --expected-page-size ${{ matrix.page-size }}
      - name: Upload test evidence even on failure
        if: always() && needs.build.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gps-emulator-api-${{ matrix.api-level }}-${{ matrix.page-size }}
          path: build/gps-instrumentation/
          if-no-files-found: warn
          retention-days: 14
