name: Update app version

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'New stable version (major.minor.patch, for example 0.7.0)'
        required: true
        type: string
      version_code:
        description: 'Optional versionCode; leave empty to increment the current value'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: app-version-update
  cancel-in-progress: false

jobs:
  update:
    # Version PRs always target main, using the workflow definition on main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Test version updater
        run: python3 -m unittest discover -s tools/tests -p 'test_*version*.py' -v
      - name: Update Android and F-Droid versions
        run: |
          args=(--version-name "$VERSION_NAME")
          if [[ -n "$VERSION_CODE" ]]; then args+=(--version-code "$VERSION_CODE"); fi
          python3 tools/update_app_version.py "${args[@]}"
          git diff --check
      - name: Open version update pull request
        env:
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          branch="release/version-$VERSION_NAME"
          remote_branch=$(git ls-remote --heads origin "refs/heads/$branch")
          if [[ -n "$remote_branch" ]]; then
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            # Reuse only the exact version update, even when main has advanced since the first run.
            git diff --binary HEAD -- app/build.gradle.kts fdroid/metadata.yml > "$RUNNER_TEMP/expected-version.patch"
            git diff --binary "origin/$branch^" "origin/$branch" > "$RUNNER_TEMP/existing-version.patch"
            if ! git merge-base --is-ancestor "origin/$branch^" HEAD || \
              ! cmp -s "$RUNNER_TEMP/expected-version.patch" "$RUNNER_TEMP/existing-version.patch"; then
              echo '::error::Existing version branch differs from the requested update. Review it manually; it will not be overwritten.'
              exit 1
            fi
            echo "Reusing verified version branch: $branch"
          else
            git switch -c "$branch"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/build.gradle.kts fdroid/metadata.yml
            git commit -m "chore: prepare app version $VERSION_NAME"
            # Never overwrite an existing branch, including one created concurrently.
            git push origin "HEAD:refs/heads/$branch"
          fi
          cat > "$RUNNER_TEMP/version-pr.md" <<'EOF'
          Updates the Android version and matching F-Droid metadata while retaining old build recipes.

          Validation: version updater unit tests and git diff --check.
          Review and run/approve the normal PR checks before merging. Create the release tag
          on the merged commit separately; this workflow does not publish a release.
          EOF
          manual_url="$SERVER_URL/$REPOSITORY/compare/main...$branch?expand=1"
          printf 'Version branch prepared. [Open a pull request manually](%s).\n' "$manual_url" >> "$GITHUB_STEP_SUMMARY"
          url=$(gh pr list --repo "$REPOSITORY" --base main --head "$branch" --state open --json url --jq '.[0].url // empty')
          if [[ -n "$url" ]]; then
            printf 'Existing version update PR: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if url=$(gh pr create --repo "$REPOSITORY" --base main --head "$branch" \
            --title "chore: prepare app version $VERSION_NAME" --body-file "$RUNNER_TEMP/version-pr.md" \
            2> "$RUNNER_TEMP/version-pr-error.txt"); then
            printf 'Version update PR: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
          elif grep -Fq 'GitHub Actions is not permitted to create or approve pull requests' "$RUNNER_TEMP/version-pr-error.txt"; then
            echo '::warning::Version branch pushed, but repository policy blocks automatic PR creation. Open the PR using the workflow summary link.'
            printf '\nAutomatic PR creation is disabled. To enable it, select **Settings → Actions → General → Workflow permissions → Allow GitHub Actions to create and approve pull requests**.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$RUNNER_TEMP/version-pr-error.txt" >&2
            exit 1
          fi
