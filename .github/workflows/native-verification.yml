name: Native formal verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kani:
    name: Native core bounded proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.kani/kani-0.68.0
            ~/.rustup/toolchains/nightly-2026-08-21-x86_64-unknown-linux-gnu
          key: kani-0.68.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned verifier and its compiler
        run: |
          rustup toolchain install nightly-2026-08-21 --profile minimal
          cargo +nightly-2026-08-21 install --locked kani-verifier --version 0.68.0
          cargo kani setup
      - name: Test verification and coverage report validation
        run: python3 -m unittest discover -s tools/tests -v
      - name: Verify native contracts and reachable witnesses
        run: python3 tools/verify_native.py
      - name: Upload proof results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-verification
          path: |
            build/native-verification/*.json
            build/native-verification/*.log
          retention-days: 14
