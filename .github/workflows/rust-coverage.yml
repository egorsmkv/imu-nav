name: Rust coverage

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

# Manual builds and tags keep independent runs; only superseded validation is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  coverage:
    name: ${{ matrix.suite }} production coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [native, server]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select affected work
        id: changes
        run: python3 tools/ci_changes.py --suite ${{ matrix.suite }}
      - name: Start PostgreSQL for selected server tests
        if: steps.changes.outputs.run == 'true' && matrix.suite == 'server'
        run: |
          docker run --detach --name ci-postgres -p 5432:5432 \
            -e POSTGRES_DB=imu_nav_test -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=test \
            postgres:18-bookworm
          for attempt in {1..30}; do
            if docker exec ci-postgres pg_isready -U postgres -d imu_nav_test; then exit 0; fi
            sleep 2
          done
          docker logs ci-postgres
          exit 1
      - name: Cache Cargo downloads
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/Cargo.lock', 'server/Cargo.lock') }}
          restore-keys: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-
      - name: Install pinned coverage toolchain
        if: steps.changes.outputs.run == 'true'
        run: rustup toolchain install nightly-2026-09-25 --profile minimal --component llvm-tools-preview
      - uses: actions/setup-java@v4
        if: (matrix.suite == 'native') && steps.changes.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: (matrix.suite == 'native') && steps.changes.outputs.run == 'true'
        with:
          # Override the action's default, which includes the retired SDK 'tools' package.
          packages: platform-tools
      - name: Install Android platform for Gradle project configuration
        if: (matrix.suite == 'native') && steps.changes.outputs.run == 'true'
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        if: (matrix.suite == 'native') && steps.changes.outputs.run == 'true'
      - name: Test browser trip playback
        if: (matrix.suite == 'server') && steps.changes.outputs.run == 'true'
        run: node --test server/tests/web/trip-player.test.cjs
      - name: Collect and gate production coverage
        if: steps.changes.outputs.run == 'true'
        env:
          TEST_POSTGRES_URL: postgresql://postgres:test@127.0.0.1:5432/imu_nav_test?sslmode=disable
        run: python3 tools/rust_coverage.py --suite '${{ matrix.suite }}'
      - name: Build optional server profiling and smoke both backends
        if: (matrix.suite == 'server') && steps.changes.outputs.run == 'true'
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-09-25
          HOTPATH_METRICS_SERVER_OFF: 'true'
        run: |
          cargo build --manifest-path server/Cargo.toml --features profiling
          python3 server/tools/traffic_sim.py --binary server/target/debug/imu-nav-cell-server --out captures/server-smoke-sqlite --backend sqlite --rounds 1 --rows 100 --trip-points 100 --sync-batch 8 --warmups 0 --repetitions 1 --profile
          python3 server/tools/traffic_sim.py --binary server/target/debug/imu-nav-cell-server --out captures/server-smoke-postgres --backend postgres --rounds 1 --rows 100 --trip-points 100 --sync-batch 8 --warmups 0 --repetitions 1 --profile
          AIR_ALERT_PROFILE_OUTPUT="$PWD/captures/air-alerts.json" cargo test --manifest-path server/Cargo.toml --features profiling --lib air_alerts::tests::profile_air_alert_delivery -- --exact
      - name: Upload reports and diagnostics
        if: (always()) && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-${{ matrix.suite }}
          path: |
            build/rust-coverage/index.html
            build/rust-coverage/summary.json
            build/rust-coverage/coverage.lcov
            build/rust-coverage/*/html/**
            build/rust-coverage/*/*.log
            build/rust-coverage/*/*.lcov
            build/rust-coverage/*/objects.json
          retention-days: 14
