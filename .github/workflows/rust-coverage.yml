name: Rust coverage

on:
  pull_request:
    paths:
      - '.github/workflows/rust-coverage.yml'
      - 'native/**'
      - 'server/Cargo.toml'
      - 'server/Cargo.lock'
      - 'server/build.rs'
      - 'server/src/**'
      - 'server/tests/**'
      - 'server/templates/**'
      - 'app/src/main/kotlin/org/imunav/app/nativecore/**'
      - 'app/build.gradle.kts'
      - 'core/**'
      - 'replay/**'
      - 'routing/build.gradle.kts'
      - 'tools/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  push:
    branches: [main]
    paths:
      - '.github/workflows/rust-coverage.yml'
      - 'native/**'
      - 'server/Cargo.toml'
      - 'server/Cargo.lock'
      - 'server/build.rs'
      - 'server/src/**'
      - 'server/tests/**'
      - 'server/templates/**'
      - 'app/src/main/kotlin/org/imunav/app/nativecore/**'
      - 'app/build.gradle.kts'
      - 'core/**'
      - 'replay/**'
      - 'routing/build.gradle.kts'
      - 'tools/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: ${{ matrix.suite }} production coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [native, server]
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: imu_nav_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d imu_nav_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned coverage toolchain
        run: rustup toolchain install nightly-2026-09-25 --profile minimal --component llvm-tools-preview
      - uses: actions/setup-java@v4
        if: matrix.suite == 'native'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: matrix.suite == 'native'
        with:
          # Override the action's default, which includes the retired SDK 'tools' package.
          packages: platform-tools
      - name: Install Android platform for Gradle project configuration
        if: matrix.suite == 'native'
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.suite == 'native'
      - name: Test coverage report validation
        run: python3 -m unittest discover -s tools/tests -v
      - name: Collect and gate production coverage
        env:
          TEST_POSTGRES_URL: postgresql://postgres:test@127.0.0.1:5432/imu_nav_test?sslmode=disable
        run: python3 tools/rust_coverage.py --suite '${{ matrix.suite }}'
      - name: Upload reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-${{ matrix.suite }}
          path: |
            build/rust-coverage/index.html
            build/rust-coverage/summary.json
            build/rust-coverage/coverage.lcov
            build/rust-coverage/*/html/**
            build/rust-coverage/*/*.log
            build/rust-coverage/*/*.lcov
            build/rust-coverage/*/objects.json
          retention-days: 14
