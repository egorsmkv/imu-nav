name: Server Docker image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/server-image.yml'
      - 'server/Dockerfile'
      - 'server/.dockerignore'
      - 'server/Cargo.toml'
      - 'server/Cargo.lock'
      - 'server/build.rs'
      - 'server/src/**'
      - 'server/templates/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke test server image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build --file server/Dockerfile --tag imu-nav-cell-server:ci server
      - name: Check server binary starts
        run: docker run --rm imu-nav-cell-server:ci --help > /dev/null
