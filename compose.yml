services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: imu_nav
      POSTGRES_USER: imu_nav
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imu_nav -d imu_nav"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  server:
    build:
      context: ./server
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CELLS_DATABASE_URL: postgresql://imu_nav:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/imu_nav?sslmode=disable
      CELLS_PUBLIC_URL: ${CELLS_PUBLIC_URL:?Set the public HTTPS URL in .env}
      CELLS_SMTP_HOST: ${CELLS_SMTP_HOST:?Set the SMTP host in .env}
      CELLS_SMTP_USERNAME: ${CELLS_SMTP_USERNAME:?Set the SMTP username in .env}
      CELLS_SMTP_PASSWORD: ${CELLS_SMTP_PASSWORD:?Set the SMTP password in .env}
      CELLS_SMTP_FROM: ${CELLS_SMTP_FROM:?Set the SMTP sender in .env}
      CELLS_PRIVACY_VERSION: ${CELLS_PRIVACY_VERSION:?Set the notice version in .env}
      CELLS_PRIVACY_CONTROLLER: ${CELLS_PRIVACY_CONTROLLER:?Set the controller in .env}
      CELLS_PRIVACY_CONTACT: ${CELLS_PRIVACY_CONTACT:?Set the operator contact in .env}
      CELLS_PRIVACY_RIGHTS_CONTACT: ${CELLS_PRIVACY_RIGHTS_CONTACT:?Set the rights contact in .env}
      CELLS_PRIVACY_REGION: ${CELLS_PRIVACY_REGION:?Set the data region in .env}
      CELLS_PRIVACY_RECIPIENTS: ${CELLS_PRIVACY_RECIPIENTS:?Set the recipients in .env}
      CELLS_PRIVACY_TRANSFERS: ${CELLS_PRIVACY_TRANSFERS:?Set transfer details in .env}
      CELLS_PRIVACY_ACCOUNT_BASIS: ${CELLS_PRIVACY_ACCOUNT_BASIS:?Set the account basis in .env}
      CELLS_PRIVACY_SECURITY_BASIS: ${CELLS_PRIVACY_SECURITY_BASIS:?Set the security basis in .env}
      CELLS_AIR_ALERTS_API_KEY: ${CELLS_AIR_ALERTS_API_KEY:-}
      CELLS_AIR_ALERTS_WEBHOOK_SECRET: ${CELLS_AIR_ALERTS_WEBHOOK_SECRET:-}
    volumes:
      - ./server/config.production.toml:/etc/imu-nav/config.toml:ro
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      CELLS_PUBLIC_URL: ${CELLS_PUBLIC_URL:?Set the public HTTPS URL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres18_data:
  caddy_data:
  caddy_config:
