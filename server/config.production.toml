# Container settings. The PostgreSQL URL and SMTP credentials come from Compose environment.
# Compose runs Caddy as the TLS reverse proxy in front of server:8080.
[server]
mode = "public"
bind = "0.0.0.0"
port = 8080
trust_proxy = true
secure_cookies = true

[database]
backend = "postgres"

[logging]
level = "info"

[policy]
min_devices = 2
max_samples = 50
area = "any"

# Operator details come from CELLS_PRIVACY_* environment variables. Review the notice
# wording with your own controller, processors, transfers and lawful bases before deployment.
[privacy]
notice_en = "Tower sharing is optional and uses your consent. We retain accepted tower observations for up to 12 months and use them to calculate public tower positions. Separate consent is required for precise-location diagnostics, which are private to you and administrators and expire after 30 days. You may also opt in to nationwide air-raid notifications while the app is open; this stores an account preference and does not send your location. You can withdraw either consent, disable alerts, export your account data or close your account at any time. This app is a research prototype, not a safety system. Optional account synchronization stores selected settings, bookmark names and coordinates, and saved route endpoints until you disable synchronization or close your account. These private records are included in account exports."
notice_uk = "Обмін даними про вежі є добровільним і ґрунтується на вашій згоді. Прийняті спостереження зберігаються до 12 місяців і використовуються для обчислення загальнодоступних координат веж. Для діагностики з точним місцезнаходженням потрібна окрема згода; ці дані доступні лише вам і адміністраторам та видаляються через 30 днів. Ви також можете увімкнути сповіщення про повітряні тривоги по всій Україні, поки застосунок відкритий; для цього зберігається налаштування облікового запису, а ваше місцезнаходження не передається. Ви можете відкликати будь-яку згоду, вимкнути сповіщення, експортувати дані облікового запису або закрити його будь-коли. Ця програма є дослідним прототипом, а не системою безпеки. Необов’язкова синхронізація зберігає вибрані налаштування, назви й координати закладок та кінцеві точки маршрутів до її вимкнення або закриття облікового запису. Ці приватні дані входять до експорту облікового запису."
notice_ru = "Обмен данными о вышках доброволен и основан на вашем согласии. Принятые наблюдения хранятся до 12 месяцев и используются для расчёта общедоступных координат вышек. Для диагностики с точным местоположением требуется отдельное согласие; эти данные доступны только вам и администраторам и удаляются через 30 дней. Вы также можете включить уведомления о воздушных тревогах по всей Украине, пока приложение открыто; для этого сохраняется настройка учётной записи, а ваше местоположение не передаётся. Вы можете отозвать любое согласие, отключить уведомления, экспортировать данные учётной записи или закрыть её в любое время. Это приложение является исследовательским прототипом, а не системой безопасности. Необязательная синхронизация хранит выбранные настройки, названия и координаты закладок и конечные точки маршрутов до её отключения или закрытия аккаунта. Эти приватные данные включены в экспорт аккаунта."
