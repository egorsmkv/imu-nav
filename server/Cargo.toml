[package]
name = "imu-nav-cell-server"
version = "0.1.0"
description = "Persistent HTTP and WebSocket cell-tower sharing server for IMU Nav"
edition = "2024"
license = "MIT"
rust-version = "1.100"

[features]
profiling = ["dep:hotpath", "hotpath/hotpath"]

[dependencies]
imu-nav-types = { path = "../native/nav-types", features = ["serde"] }
imu-nav-protocol = { path = "../desktop/protocol" }
anyhow = "1.0"
argon2 = "0.6"
askama = "0.16.1"
axum = { version = "0.8", features = ["ws", "multipart"] }
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "env"] }
csv = "1.4"
flate2 = "1.1"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
futures-util = "0.3"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rpassword = "7.5.5"
hotpath = { version = "=0.31.2", default-features = false, optional = true }
rusqlite = { version = "0.42", features = ["bundled"] }
postgres = "0.19"
postgres-native-tls = "0.5"
native-tls = "0.2"
r2d2 = "0.8"
r2d2_postgres = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.2"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread", "signal", "fs", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tempfile = "3.27"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

zip = { version = "9.5", default-features = false, features = ["deflate"] }
hex = "0.4"

[dev-dependencies]
tokio = { version = "1.54", features = ["test-util"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "gzip", "json", "rustls"] }
tokio-tungstenite = "0.30"

# Spend more build time on whole-program optimization for production binaries.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[lints.cargo]
unused_dependencies = "deny"
