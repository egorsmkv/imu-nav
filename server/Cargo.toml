[package]
name = "imu-nav-cell-server"
version = "0.1.0"
description = "Persistent HTTP and WebSocket cell-tower sharing server for IMU Nav"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[features]
profiling = ["dep:hotpath", "hotpath/hotpath"]

[dependencies]
anyhow = "1.0"
argon2 = "0.5"
askama = "0.16.1"
axum = { version = "0.8", features = ["ws", "multipart"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
csv = "1.3"
flate2 = "1.1"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
futures-util = "0.3"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rpassword = "7.5.4"
hotpath = { version = "=0.28.4", default-features = false, optional = true }
rusqlite = { version = "0.40", features = ["bundled"] }
postgres = "0.19"
postgres-native-tls = "0.5"
native-tls = "0.2"
r2d2 = "0.8"
r2d2_postgres = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "fs", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tempfile = "3.21"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

zip = { version = "8.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1.47", features = ["test-util"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "gzip", "json", "rustls"] }
tokio-tungstenite = "0.30"

# Spend more build time on whole-program optimization for production binaries.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
