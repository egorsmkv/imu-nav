[package]
name = "imu-nav-cell-server"
version = "0.1.0"
description = "Persistent HTTP and WebSocket cell-tower sharing server for IMU Nav"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.5", features = ["derive", "env"] }
csv = "1.3"
flate2 = "1.1"
futures-util = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["gzip", "json", "rustls-tls"] }
tempfile = "3.21"
tokio-tungstenite = "0.27"
