<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · IMU Nav</title>
<style>
  :root { font-family: system-ui, sans-serif; color: #172033; background: #f4f6fa; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
  main { width: min(100% - 2rem, 26rem); padding: 2rem; border: 1px solid #dce2ec; border-radius: 1rem; background: white; box-shadow: 0 8px 30px #17203310; }
  h1 { margin: 0 0 .5rem; }
  p { line-height: 1.5; color: #536176; }
  label { display: block; margin: 1.25rem 0 .4rem; font-weight: 600; }
  input { box-sizing: border-box; width: 100%; padding: .75rem; border: 1px solid #aeb9ca; border-radius: .5rem; font: inherit; }
  button { width: 100%; margin-top: 1.5rem; padding: .8rem; border: 0; border-radius: .5rem; background: #174ea6; color: white; font: inherit; font-weight: 700; cursor: pointer; }
  .error { padding: .75rem; border-radius: .5rem; background: #fff0ee; color: #9b1c14; }
  footer { margin-top: 1.5rem; font-size: .9rem; }
</style>
<main>
  <h1>{{ title }}</h1>
  <p>View and manage the cell observations uploaded by your IMU Nav account.</p>
  {% if !error.is_empty() %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form action="{{ action }}" method="post">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ email }}" autocomplete="email" required maxlength="254">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="{% if signup %}new-password{% else %}current-password{% endif %}" {% if signup %}minlength="12"{% endif %} required>
    <button type="submit">{{ title }}</button>
  </form>
  <footer>
    {% if signup %}Already have an account? <a href="/login">Sign in</a>.{% else %}New here? <a href="/signup">Create an account</a>.{% endif %}
    <p>IMU Nav is a research prototype, not a safety system.</p>
  </footer>
</main>
</html>
