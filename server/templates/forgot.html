<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password · IMU Nav</title>
<link rel="stylesheet" href="/web.css?v=20261005-ui">
{% include "site_header.html" %}
<main class="page-shell auth-shell"><section class="card">
  <h1>Reset password</h1>
  {% if success %}
  <p>If this address has an account, we sent a reset link. Check your inbox.</p>
  {% else %}
  {% if !error.is_empty() %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form action="/forgot-password" method="post">
    <label for="email">Account email</label>
    <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
    <button class="primary" type="submit">Send reset link</button>
  </form>
  {% endif %}
  <p><a href="/login">Return to sign in</a></p>
</section></main>
{% include "site_footer.html" %}
<script src="/web-locale.js?v=20261005-ui" defer></script>
</html>
